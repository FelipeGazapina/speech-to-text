name: macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish the .dmg as a GitHub release with this tag (e.g. v0.1.0). Empty = build only."
        required: false
        default: ""

permissions:
  contents: write  # to publish the .dmg as a release (v* tag push, or release_tag input)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: pytest -q

  dmg:
    needs: test
    runs-on: macos-14  # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Speech to Text.app and the .dmg
        run: packaging/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SpeechToText-dmg
          path: dist/SpeechToText.dmg
          if-no-files-found: error
      # Pushing to the default branch publishes v<version from pyproject.toml> once, if not released yet.
      - name: Check whether this version is released yet
        id: version
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
          else
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || steps.version.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Speech to Text ${{ inputs.release_tag || steps.version.outputs.tag || github.ref_name }}
          body_path: packaging/release-notes.md
          files: dist/SpeechToText.dmg
