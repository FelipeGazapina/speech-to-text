[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-to-text"
version = "0.1.0"
description = "Press a key, talk, press again: local Whisper dictation for macOS that pastes wherever your cursor is."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sounddevice",
    # macOS glue: menu bar, global hotkey, clipboard, synthetic Cmd+V
    "rumps; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement; sys_platform == 'darwin'",
    # Transcription: MLX on Apple Silicon (fast, uses the GPU), faster-whisper elsewhere
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stt = "speech_to_text.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
